name: Feature request
description: Something mirrust should measure, report or make easier.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, not the solution. Which client, which server, what you could not tell.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like mirrust to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
