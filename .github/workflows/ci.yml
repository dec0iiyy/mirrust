name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are of no use in a fresh checkout and only enlarge the cache.
  CARGO_INCREMENTAL: "0"

# Rust is installed with rustup, which the GitHub-hosted Ubuntu and macOS images ship.
# aws-lc-sys (through rustls and quinn) needs only a C compiler on these targets: it has
# pregenerated bindings for x86_64-unknown-linux-gnu and aarch64-apple-darwin and, without
# the `fips` feature, builds with the `cc` crate, so neither CMake nor bindgen is installed.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # aws-lc-sys needs NASM on Windows x86-64; this makes it use its prebuilt objects instead.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  msrv:
    # Keep the version in step with `rust-version` in Cargo.toml.
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (1.88)
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          rustup default 1.88
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # --all-targets: the tests, examples and benches must build with the minimum version
      # too, or a contributor on it could not run them.
      - run: cargo check --workspace --all-targets --locked

  install-script:
    # install.sh against a fake release served from a local directory: no network, and not
    # the published release (that test is `test-install.sh --online`, run by hand).
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test script runs shellcheck too when it is installed; here it is required on Ubuntu,
      # where the runner image has it, so that a missing tool cannot skip the check.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh .github/scripts/test-install.sh
      - name: Test install.sh
        run: .github/scripts/test-install.sh
