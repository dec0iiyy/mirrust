name: Dependencies

# cargo-deny reads deny.toml: RustSec advisories, yanked and unmaintained crates, licences, and
# sources. The advisory database changes without a commit here, so the check also runs weekly.
on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "crates/*/Cargo.toml"
      - deny.toml
      - .github/workflows/deny.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "crates/*/Cargo.toml"
      - deny.toml
      - .github/workflows/deny.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
