name: Corpus sync

# Once a week, proposes new corpus/clients.jsonl lines from the captured test signatures of
# curl-impersonate (MIT, lexiforest/curl-impersonate) as one pull request on the branch
# `corpus-sync`. The tool (crates/corpus-sync) only appends lines whose ja4 the file lacks.
#
# Opening the pull request with GITHUB_TOKEN needs the repository setting "Allow GitHub
# Actions to create and approve pull requests" (Settings > Actions > General > Workflow
# permissions). Without it the branch is still pushed and the job fails with a pointer to the
# setting. Pull requests opened with GITHUB_TOKEN do not start the CI workflow by themselves.

on:
  schedule:
    # Mondays at 05:17 UTC.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BRANCH: corpus-sync
  UPSTREAM: https://github.com/lexiforest/curl-impersonate.git

jobs:
  sync:
    name: propose new clients
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clone curl-impersonate
        run: git clone --depth 1 "$UPSTREAM" "$RUNNER_TEMP/curl-impersonate"
      - name: Find new entries
        id: find
        run: |
          cargo run --locked -p corpus-sync -- "$RUNNER_TEMP/curl-impersonate" corpus/clients.jsonl \
            > "$RUNNER_TEMP/new.jsonl" 2> "$RUNNER_TEMP/report.txt"
          cat "$RUNNER_TEMP/report.txt"
          if [ -s "$RUNNER_TEMP/new.jsonl" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new entries."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Append and test
        if: steps.find.outputs.changed == 'true'
        id: test
        run: |
          cat "$RUNNER_TEMP/new.jsonl" >> corpus/clients.jsonl
          if cargo test --locked -p fingerprint; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::cargo test -p fingerprint failed with the new lines; see the pull request checklist."
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the pull request body
        if: steps.find.outputs.changed == 'true'
        env:
          TEST_RESULT: ${{ steps.test.outputs.result }}
        run: |
          commit=$(git -C "$RUNNER_TEMP/curl-impersonate" rev-parse --short=7 HEAD)
          {
            echo "New \`corpus/clients.jsonl\` lines from the captured test signatures of"
            echo "[curl-impersonate](https://github.com/lexiforest/curl-impersonate) at \`$commit\`,"
            echo "licence MIT. Generated by \`crates/corpus-sync\`; the JA4 values come from this"
            echo "repository's \`fingerprint\` crate and the Akamai strings from its \`http2\` crate."
            echo
            echo "\`cargo test -p fingerprint\` with these lines: **$TEST_RESULT**."
            echo
            echo "## New entries"
            echo
            echo "| family | version | ja4 | source |"
            echo "| --- | --- | --- | --- |"
            jq -r '"| \(.family) | \(.version) | `\(.ja4)` | \(.source | capture("^curl-impersonate (?<f>.*?) \\(").f) |"' \
              "$RUNNER_TEMP/new.jsonl"
            echo
            echo "## Already known (widening candidates)"
            echo
            echo '```'
            grep 'already known' "$RUNNER_TEMP/report.txt" || echo "none"
            echo '```'
            echo
            echo "## Reviewer checklist"
            echo
            echo "- [ ] A new \`family\` has a row in \`Client::agrees_with\` (crates/fingerprint/src/known.rs) and is in the test's \`FAMILIES\` list."
            echo "- [ ] The entry counts in README.md, docs/reference.md and docs/architecture.md are updated."
            echo "- [ ] \`version\`, \`version_min\` and \`version_max\` are right; the ranges of the widening candidates above are widened if wanted."
            echo "- [ ] Entries whose \`source\` says the hello resumes a session are wanted at all."
            echo "- [ ] docs/fingerprints.md section 12.3 and 12.4 still describe the dataset."
            echo "- [ ] CI ran on this branch (a pull request opened with GITHUB_TOKEN does not start it; push a commit or close and reopen)."
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"
      - name: Push the branch and open or update the pull request
        if: steps.find.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add corpus/clients.jsonl
          git commit -m "corpus: new clients from curl-impersonate signatures"
          git push --force origin "$BRANCH"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/body.md"
            exit 0
          fi
          if ! gh pr create --base "$BASE" --head "$BRANCH" \
              --title "corpus: new clients from curl-impersonate signatures" \
              --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::Could not open the pull request. Enable Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests', or open it by hand from the pushed branch '$BRANCH'."
            exit 1
          fi
