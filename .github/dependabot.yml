version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rustls-and-quic:
        patterns: ["rustls*", "tokio-rustls", "quinn*", "h3*", "rcgen"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The two base images of deploy/Dockerfile, each pinned by tag and digest. Without this entry
  # the pins never move. The Docker workflow builds and smoke-tests the pull request.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
