[workspace]
resolver = "3"
members = ["crates/*"]
# The cargo-fuzz crate has its own workspace and lockfile and builds with nightly only.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
fingerprint = { path = "crates/fingerprint" }
golden = { path = "crates/golden" }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
httpdate = "1"
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "hyper-rustls", "rcgen"] }
loona-hpack = "0.4.3"
md-5 = "0.11"
proptest = "1.12"
quinn = { version = "0.11.12", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto"] }
rustls = "0.23.46"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
tcp-save-syn = "0.1.0"
tokio = { version = "1.54.1", features = ["io-util", "time"] }
tokio-rustls = "0.26.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
# Optimise across crate boundaries at a moderate cost in build time.
lto = "thin"
codegen-units = 1
# Leave symbol tables and debug sections out of the binary.
strip = "symbols"
# The default, stated on purpose: a panic in one connection's task must end that task,
# not the process. Do not change this to "abort".
panic = "unwind"
