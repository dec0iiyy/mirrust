[package]
name = "server"
description = "mirrust: a TLS server that echoes the client's fingerprints, as tls.peet.ws does"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mirrust"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
audit = { path = "../audit" }
bytes.workspace = true
fingerprint = { path = "../fingerprint" }
h3.workspace = true
h3-quinn.workspace = true
http.workspace = true
httpdate.workspace = true
http2 = { path = "../http2" }
http3 = { path = "../http3" }
instant-acme.workspace = true
quic = { path = "../quic" }
quinn = { workspace = true, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true

[dev-dependencies]
h2.workspace = true
http.workspace = true
proptest.workspace = true

[lints]
workspace = true
