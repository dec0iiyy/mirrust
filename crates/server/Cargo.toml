[package]
name = "server"
description = "mirrust: a TLS server that echoes the client's fingerprints, as tls.peet.ws does"
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mirrust"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
audit = { path = "../audit" }
bytes.workspace = true
fingerprint = { path = "../fingerprint" }
h3.workspace = true
h3-quinn.workspace = true
http.workspace = true
httpdate.workspace = true
http2 = { path = "../http2" }
http3 = { path = "../http3" }
instant-acme.workspace = true
quic = { path = "../quic" }
quinn = { workspace = true, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { workspace = true, features = ["pem"] }
rustls.workspace = true
serde_json.workspace = true
tcp-save-syn.workspace = true
tcpip = { path = "../tcpip" }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true

[dev-dependencies]
base64.workspace = true
h2.workspace = true
http.workspace = true
http-body = "1"
proptest.workspace = true
# Reads the CSR and the challenge certificate in the fake CA of `acme/order/fake_ca.rs`.
rcgen = { workspace = true, features = ["x509-parser"] }
sha2.workspace = true
x509-parser = "0.18"

[lints]
workspace = true
