<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · mirrust</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23151514'/%3E%3Cpath d='M14 8 6 16l8 8zM18 8l8 8-8 8z' fill='%23ededea'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f3f3ef;
    --surface: #ffffff;
    --sunken: #f6f6f2;
    --ink: #151514;
    --muted: #66665f;
    --faint: #a3a39b;
    --rule: #e2e2db;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e0d;
      --surface: #181817;
      --sunken: #121211;
      --ink: #ededea;
      --muted: #9d9d96;
      --faint: #5f5f59;
      --rule: #2a2a28;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  main { max-width: 720px; margin: 0 auto; padding: 28px 24px 64px; }
  @media (max-width: 640px) { main { padding: 18px 12px 48px; } }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--ink); }
  .mono { font-family: var(--mono); }

  .top { margin-bottom: 20px; }
  .wordmark { font: 700 18px/1 var(--mono); text-decoration: none; }
  .wordmark span { color: var(--muted); font: 400 14px var(--sans); margin-left: 10px; }

  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 16px; }
  .panel > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 16px 20px 0; }
  .panel > header h1, .panel > header h2 { margin: 0; font: 700 17px/1.3 var(--sans); }
  .panel > header p { margin: 0; color: var(--muted); font-size: 13px; }
  .panel > .body { padding: 14px 20px 20px; }
  @media (max-width: 640px) {
    .panel > header { padding: 14px 14px 0; }
    .panel > .body { padding: 12px 14px 16px; }
  }

  .code { font: 700 clamp(28px, 6vw, 44px)/1.1 var(--mono); letter-spacing: -0.02em; margin: 0 0 10px; }
  .path { margin: 0 0 14px; background: var(--sunken); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; font: 13px/1.55 var(--mono); overflow-wrap: anywhere; }
  .body p { margin: 0; }

  dl.facts { margin: 0; display: grid; grid-template-columns: 140px minmax(0, 1fr); }
  dl.facts dt, dl.facts dd { padding: 8px 0; border-top: 1px solid var(--rule); margin: 0; }
  dl.facts dt:first-of-type, dl.facts dd:first-of-type { border-top: 0; padding-top: 0; }
  dl.facts dt { font-weight: 600; font-size: 14px; }
  dl.facts dd { font-size: 14px; }
  @media (max-width: 640px) {
    dl.facts { grid-template-columns: minmax(0, 1fr); }
    dl.facts dd { border-top: 0; padding-top: 0; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="wordmark" href="/">mirrust<span>how your client looks on the wire</span></a>
  </div>
  <section class="panel">
    <header><h1>Page not found</h1></header>
    <div class="body">
      <p class="code">404</p>
      <p class="path" id="path">This path</p>
      <p>Nothing is served here. <a href="/">Back to your fingerprint</a>, or use the API below.</p>
    </div>
  </section>
  <section class="panel">
    <header><h2>API</h2><p>your connection as JSON</p></header>
    <div class="body">
      <dl class="facts">
        <dt><a class="mono" href="/api/all">/api/all</a></dt><dd>everything mirrust reports</dd>
        <dt><a class="mono" href="/api/tls">/api/tls</a></dt><dd>TLS only</dd>
        <dt><a class="mono" href="/api/clean">/api/clean</a></dt><dd>fingerprints only</dd>
        <dt><a class="mono" href="/api/raw">/api/raw</a></dt><dd>raw ClientHello bytes</dd>
      </dl>
    </div>
  </section>
</main>
<script>
  // The path comes from the address bar: set as text, never parsed as HTML.
  document.getElementById("path").textContent = location.pathname + location.search;
</script>
</body>
</html>
